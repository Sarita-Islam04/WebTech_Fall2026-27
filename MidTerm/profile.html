<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
  </head>
  <body>
     <h1>My profile </h1>
    <form>
       <fieldset>
        <legend>Profile Information</legend>

        <img src="SARITA.jpeg" alt="SARITA" width="150" height="150">
        <table>
          <tr>
            <td><label for="name">Name:</label></td>
            <td>
              <input
                type="text"
                id="name"
                name="name"
                value="Sarita Islam Usmita"
                required
              />
            </td>
          </tr>
          <tr>
            <td>
              <label for="student id ">Student Id:</label>
            </td>

            <td>
              <input
                type="text"
                id="student id"
                name="student id"
                value="24-56695-1"
                required
              />
            </td>
          </tr>

          <tr>
            <td>
              <label for="cgpa ">CGPA:</label>
            </td>

            <td>
              <input
                type="number"
                id="CGPA"
                name="CGPA"
                value="3.45"
                required
              />
              <tr>
                <td>
                  <label for="dob">Date of Birth:</label>
                </td>
                <td>
                  <input
                    type="date"
                    id="dob"
                    name="dob"
                    value="2003-12-04"
                    required
                  />
                </td>
              </tr>

              <tr>
                <td>
                  <label>Gender:</label>
                </td>
                <td>
                  <input
                    type="radio"
                    id="female"
                    name="gender"
                    value="Female"
                    checked
                  />
                  <label for="female">Female</label>

                  <input type="radio" id="male" name="gender" value="Male" />
                  <label for="male">Male</label>
                </td>
              </tr>
            </td>
          </tr>

         </table>
        
        
        <legend>Education</legend>

          <table border=auto
            <tr>
              <th>Program</th>
              <th>Major</th>
              <th>Year</th>
              <th>Institute</th>
            </tr>

            <tr>
              <td>SSC</td>
              <td>Science</td>
              <td>2019</td>
              <td>KC Model School and College</td>
            </tr>

            <tr>
              <td>HSC</td>
              <td>Science</td>
              <td>2022</td>
              <td>Milestone College</td>
            </tr>
             
            </tr>

            <tr>
              <td>BSc</td>
              <td>CSE</td>
              <td>2024</td>
              <td>AIUB</td>
            </tr>
          </table>
        </table>
      </fieldset>
    </form>
  </body>
</html>
