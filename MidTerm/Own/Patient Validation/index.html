<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Patient Registration</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Connect JavaScript -->
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="container">
      <h1>Patient Registration Form</h1>

      <form id="patientForm" novalidate>
        <!-- Personal Information -->
        <fieldset>
          <legend>Personal Information</legend>

          <label for="name">Patient Name:</label>

          <input type="text" id="name" placeholder="Enter your name" />

          <p class="error" id="nameError"></p>

          <label for="age">Patient Age:</label>

          <input type="number" id="age" placeholder="Enter your age" />

          <p class="error" id="ageError"></p>

          <label for="email">Patient Email:</label>

          <input type="email" id="email" placeholder="Enter your email" />

          <p class="error" id="emailError"></p>

          <label for="dob">Date of Birth:</label>

          <input type="date" id="dob" />

          <p class="error" id="dobError"></p>

          <label for="phone">Phone Number:</label>

          <input type="tel" id="phone" placeholder="01712345678" />

          <p class="error" id="phoneError"></p>

          <label>Gender:</label>

          <div class="options">
            <label>
              <input type="radio" name="gender" value="Male" />
              Male
            </label>

            <label>
              <input type="radio" name="gender" value="Female" />
              Female
            </label>

            <label>
              <input type="radio" name="gender" value="Other" />
              Other
            </label>
          </div>

          <p class="error" id="genderError"></p>

          <label for="address">Address:</label>

          <textarea id="address" placeholder="Enter your address"></textarea>

          <p class="error" id="addressError"></p>

          <label for="country">Citizenship:</label>

          <select id="country">
            <option value="">Select Country</option>

            <option value="Bangladesh">Bangladesh</option>

            <option value="USA">USA</option>

            <option value="UK">UK</option>
          </select>

          <p class="error" id="countryError"></p>
        </fieldset>

        <!-- Medical Information -->
        <fieldset>
          <legend>Medical Information</legend>

          <label>Preferred Doctor Department:</label>

          <div class="options">
            <label>
              <input type="checkbox" name="department" value="Medicine" />
              Medicine
            </label>

            <label>
              <input type="checkbox" name="department" value="Cardiac" />
              Cardiac
            </label>

            <label>
              <input type="checkbox" name="department" value="Neurology" />
              Neurology
            </label>
          </div>

          <p class="error" id="departmentError"></p>
        </fieldset>

        <!-- User Profile -->
        <fieldset>
          <legend>User Profile</legend>

          <label for="username">Username:</label>

          <input type="text" id="username" placeholder="Enter username" />

          <p class="error" id="usernameError"></p>

          <label for="password">Password:</label>

          <input type="password" id="password" placeholder="Enter password" />

          <p class="hint">
            At least 8 characters, one uppercase, one lowercase and one number.
          </p>

          <p class="error" id="passwordError"></p>

          <label for="confirmPassword"> Confirm Password: </label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Re-enter password"
          />

          <p class="error" id="confirmError"></p>
        </fieldset>

        <!-- Terms and Conditions -->
        <div class="terms">
          <input type="checkbox" id="terms" />

          <label for="terms"> I Agree to Terms and Conditions </label>
        </div>

        <p class="error" id="termsError"></p>

        <!-- Result Message -->
        <p id="result"></p>

        <!-- Buttons -->
        <button type="submit">Register</button>

        <button type="reset" class="reset">Reset</button>
      </form>
    </div>
  </body>
</html>
